<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Note Board</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
    <link rel="stylesheet" href="/styles.css">
    <script src="/config.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="whiteboard" aria-labelledby="board-heading">
        <div class="board-toolbar">
          <div class="board-meta">
            <h1 id="board-heading">Loading…</h1>
            <p id="board-status" class="board-status" role="status" aria-live="polite"></p>
          </div>
          <div class="board-controls">
            <div class="history-controls">
              <label class="visually-hidden" for="history-from">Browse from</label>
              <input id="history-from" type="date" min="2026-10-14" aria-label="Browse from">
              <span class="range-separator" aria-hidden="true">–</span>
              <label class="visually-hidden" for="history-to">Browse to</label>
              <input id="history-to" type="date" min="2026-10-14" aria-label="Browse to">
              <button id="view-date" class="button button-light" type="button">Open</button>
            </div>
            <button id="view-today" class="button button-dark" type="button">Today</button>
            <div class="admin-controls">
              <span id="admin-badge" class="admin-badge" hidden>ADMIN</span>
              <button id="reset-today" class="button button-light" type="button" hidden>Reset</button>
            </div>
          </div>
        </div>
        <div id="notes" class="notes-grid" aria-live="polite" aria-busy="false"></div>
      </main>

      <form id="note-form" class="composer" aria-label="Post a note">
        <label class="visually-hidden" for="note-text">Write a note</label>
        <textarea id="note-text" name="text" rows="2" maxlength="500" placeholder="Write a note…"></textarea>
        <div id="image-preview" class="image-preview" hidden>
          <img id="image-preview-img" alt="Selected image preview">
          <button id="remove-image" class="remove-image" type="button" aria-label="Remove image">×</button>
        </div>
        <div class="composer-footer">
          <div class="composer-tools">
            <input id="note-image" class="visually-hidden" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
            <label class="button button-light button-attach" for="note-image">Photo</label>
            <span id="character-count" class="character-count">0/10 lines · 0/250 chars</span>
          </div>
          <div class="composer-actions">
            <span class="shortcut-hint"><kbd>Ctrl</kbd><span>+</span><kbd>Enter</kbd></span>
            <button id="submit-note" class="button button-post" type="submit">Post</button>
          </div>
        </div>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </body>
</html>
